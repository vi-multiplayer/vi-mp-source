name: Documentation improvement
description: Report a documentation error or propose a documentation change.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/STRUCTURE.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Explain the error or missing information.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
    validations:
      required: false
